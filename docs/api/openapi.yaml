openapi: 3.0.3
info:
  title: EXAM System API
  description: |
    REST API for the EXAM system. This API provides endpoints for managing reports.
    
    ## Authentication
    In production, this API uses Shibboleth/HAKA authentication. For local development,
    dev auth mode can be enabled (see configuration).
    
    ## Pagination
    List endpoints support pagination using `page` and `pageSize` query parameters.
    The response includes pagination metadata.
    
    ## Error Handling
    All errors follow a consistent format with `error`, `message`, and optional `details` fields.
    
    ## Idempotency
    - PUT operations are idempotent - multiple identical requests have the same effect
    - DELETE operations are idempotent - deleting a non-existent resource returns 404 but is safe to retry
  version: 1.0.0
  contact:
    name: EXAM System Support
    email: support@example.com

servers:
  - url: http://localhost:9000
    description: Local development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: reports
    description: Report management operations

paths:
  /api/v1/reports:
    get:
      summary: List reports
      description: |
        Retrieve a paginated list of reports. Supports filtering by title or content.
      operationId: listReports
      tags:
        - reports
      parameters:
        - name: filters
          in: query
          description: Filter reports by title or content (case-insensitive partial match)
          required: false
          schema:
            type: string
            example: "quarterly"
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: pageSize
          in: query
          description: Number of items per page (max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReportResponse'
              example:
                data:
                  - id: 1
                    title: "Q1 2024 Report"
                    content: "First quarter results..."
                    createdAt: "2024-01-15T10:30:00Z"
                pagination:
                  page: 1
                  pageSize: 20
                  total: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      summary: Create a new report
      description: Create a new report. The `id` and `createdAt` fields are automatically generated.
      operationId: createReport
      tags:
        - reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
            example:
              title: "Q2 2024 Report"
              content: "Second quarter analysis and results..."
      responses:
        '201':
          description: Report created successfully
          headers:
            Location:
              description: URI of the created report
              schema:
                type: string
                example: "/api/v1/reports/1"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
              example:
                id: 1
                title: "Q2 2024 Report"
                content: "Second quarter analysis and results..."
                createdAt: "2024-04-15T14:20:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/reports/{id}:
    get:
      summary: Get a report by ID
      description: Retrieve a single report by its ID.
      operationId: getReport
      tags:
        - reports
      parameters:
        - name: id
          in: path
          required: true
          description: Report ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Report found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
              example:
                id: 1
                title: "Q1 2024 Report"
                content: "First quarter results..."
                createdAt: "2024-01-15T10:30:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    put:
      summary: Update a report
      description: |
        Update an existing report. This operation is idempotent - multiple identical
        requests have the same effect as a single request.
      operationId: updateReport
      tags:
        - reports
      parameters:
        - name: id
          in: path
          required: true
          description: Report ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReportRequest'
            example:
              title: "Q1 2024 Report (Updated)"
              content: "Updated first quarter results..."
      responses:
        '200':
          description: Report updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
              example:
                id: 1
                title: "Q1 2024 Report (Updated)"
                content: "Updated first quarter results..."
                createdAt: "2024-01-15T10:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    delete:
      summary: Delete a report
      description: |
        Delete a report by ID. This operation is idempotent - deleting a non-existent
        report returns 404 but is safe to retry.
      operationId: deleteReport
      tags:
        - reports
      parameters:
        - name: id
          in: path
          required: true
          description: Report ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '204':
          description: Report deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    ReportResponse:
      type: object
      required:
        - id
        - title
        - content
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          description: Unique report identifier
          example: 1
        title:
          type: string
          description: Report title
          maxLength: 255
          example: "Q1 2024 Report"
        content:
          type: string
          description: Report content
          example: "First quarter results and analysis..."
        createdAt:
          type: string
          format: date-time
          description: Report creation timestamp (ISO 8601)
          example: "2024-01-15T10:30:00Z"
    
    CreateReportRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          description: Report title
          maxLength: 255
          example: "Q2 2024 Report"
        content:
          type: string
          description: Report content
          example: "Second quarter analysis and results..."
    
    UpdateReportRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          description: Report title
          maxLength: 255
          example: "Q1 2024 Report (Updated)"
        content:
          type: string
          description: Report content
          example: "Updated first quarter results..."
    
    PaginatedReportResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportResponse'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
    
    PaginationInfo:
      type: object
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
          description: Current page number (1-based)
          minimum: 1
          example: 1
        pageSize:
          type: integer
          description: Number of items per page
          minimum: 1
          example: 20
        total:
          type: integer
          description: Total number of items
          minimum: 0
          example: 42
        totalPages:
          type: integer
          description: Total number of pages
          minimum: 0
          example: 3
    
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - INTERNAL_ERROR
          example: "NOT_FOUND"
        message:
          type: string
          description: Human-readable error message
          example: "Report with id 999 not found"
        details:
          type: string
          description: Additional error details (may be omitted)
          example: "The requested resource does not exist"

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "VALIDATION_ERROR"
            message: "Invalid request body"
            details: "JsResultException(errors:List((/title,List(JsonValidationError(List(error.path.missing),WrappedArray())))))"
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "NOT_FOUND"
            message: "Report with id 999 not found"
    
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "INTERNAL_ERROR"
            message: "Failed to retrieve reports"
            details: "Database connection timeout"
