play.application.loader = "app.ExamApplicationLoader"

play.http.secret.key = ${?APPLICATION_SECRET}

db.default {
  driver = "org.postgresql.Driver"
  url = "jdbc:postgresql://postgres:5432/exam"
  username = ${?DB_USERNAME}
  password = ${?DB_PASSWORD}
}

# Slick database configuration
slick.dbs.default {
  profile = "slick.jdbc.PostgresProfile$"
  db {
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://postgres:5432/exam"
    user = ${?DB_USERNAME}
    password = ${?DB_PASSWORD}
    numThreads = 5
    connectionTimeout = 5000
  }
}

play.filters.enabled += "play.filters.cors.CORSFilter"

# Dev auth mode (bypass Shibboleth/HAKA)
exam.dev.auth.enabled = ${?DEV_AUTH_ENABLED}
exam.dev.auth.user = ${?DEV_AUTH_USER}

# Logging
play.logger.includeConfigProperties = true

# Rate Limiting
exam.rate.limit.enabled = ${?RATE_LIMIT_ENABLED}
exam.rate.limit.requests = ${?RATE_LIMIT_REQUESTS}
exam.rate.limit.window = ${?RATE_LIMIT_WINDOW}
exam.rate.limit.api.paths = ${?RATE_LIMIT_API_PATHS}

# Security Headers
exam.security.headers.enabled = ${?SECURITY_HEADERS_ENABLED}
exam.security.headers.hsts.maxAge = ${?SECURITY_HEADERS_HSTS_MAX_AGE}
exam.security.headers.csp = ${?SECURITY_HEADERS_CSP}

# Audit Logging
exam.audit.enabled = ${?AUDIT_ENABLED}
exam.audit.log.api.only = ${?AUDIT_LOG_API_ONLY}
exam.audit.log.success = ${?AUDIT_LOG_SUCCESS}
exam.audit.log.failures = ${?AUDIT_LOG_FAILURES}
