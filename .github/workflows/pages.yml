name: Deploy GitHub Pages demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build demo
        working-directory: frontend
        run: npm run build:demo

      - name: Select Pages artifact directory
        id: dist
        working-directory: frontend
        run: |
          if [ -f dist/exam-frontend/index.html ]; then
            echo "dir=frontend/dist/exam-frontend" >> "$GITHUB_OUTPUT"
          elif [ -f dist/exam-frontend/browser/index.html ]; then
            echo "dir=frontend/dist/exam-frontend/browser" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find index.html under dist/exam-frontend" >&2
            find dist -type f -name 'index.html' || true
            exit 1
          fi
          echo "Selected artifact directory:"
          grep '^dir=' "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.dist.outputs.dir }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
